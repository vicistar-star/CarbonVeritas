name: Nightly Audit

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run audit
        run: cargo audit
        working-directory: contracts
        continue-on-error: true

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "channel": "#security-alerts",
              "text": "⚠️ Cargo audit found vulnerabilities in CarbonVeritas contracts"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK }}

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [api, frontend, indexer, sdk, cli]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.package }}

      - name: Run npm audit
        run: npm audit --audit-level=high
        working-directory: ${{ matrix.package }}
        continue-on-error: true

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "channel": "#security-alerts",
              "text": "⚠️ npm audit found vulnerabilities in @carbonveritas/${{ matrix.package }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK }}

  report:
    name: Audit Summary
    runs-on: ubuntu-latest
    needs: [cargo-audit, npm-audit]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Cargo audit: ${{ needs.cargo-audit.result }}"
          echo "NPM audit: ${{ needs.npm-audit.result }}"
