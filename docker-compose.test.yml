version: "3.9"

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carbonveritas_test
      POSTGRES_USER: carbonveritas
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonveritas -d carbonveritas_test"]
      interval: 5s
      timeout: 3s
      retries: 5
    tmpfs: /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-test:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3003:3000"
    environment:
      NODE_ENV: test
      PORT: "3000"
      DATABASE_URL: postgresql://carbonveritas:secret@postgres-test:5432/carbonveritas_test
      REDIS_URL: redis://redis-test:6379
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_SOROBAN_RPC: https://soroban-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      JWT_SECRET: test-jwt-secret
      JWT_EXPIRY: 24h
      SEP10_HOME_DOMAIN: localhost:3000
      PINATA_API_KEY: ""
      PINATA_API_SECRET: ""
      IPFS_GATEWAY: https://gateway.pinata.cloud/ipfs
      PROTOCOL_FEE_BPS: "50"
      VERIFIER_THRESHOLD: "1"
      VERIFIER_QUORUM: "1"
      APPROVAL_WINDOW_HOURS: "168"
      CERT_SIGNING_KEY: ""
      CERT_OUTPUT_DIR: /tmp/cv-certs
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
