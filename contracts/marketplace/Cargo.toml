[package]
name = "carbonveritas-marketplace"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "21.0.0"
carbonveritas-shared = { path = "../shared" }
carbonveritas-credit-registry = { path = "../credit-registry" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
